<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Life Analyzer — Premium Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root[data-theme="dark"] {
  /* Dynamic multi-color ambient background blend */
  --bg: radial-gradient(circle at 10% 20%, rgba(255, 107, 107, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(108, 99, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255, 165, 0, 0.1) 0%, transparent 50%),
        #090b0f;
  --surface: rgba(21, 24, 33, 0.8);
  --surface2: rgba(28, 32, 48, 0.9);
  --border: rgba(255, 255, 255, 0.12);
  --border-focus: #ffbc00;
  --accent: #ff9f1c;
  --accent-gradient: linear-gradient(135deg, #ffbc00, #ff6b35); /* Yellow-Orange Mix */
  --accent2: #00d9a6;
  --text: #e8eaf0;
  --text2: #8892a4;
  --text3: #4a5568;
  --success: #00d9a6;
  --warning: #f6c90e;
  --danger: #ff6b6b;
  --glass-blur: blur(20px);
  --shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);

  /* Tab Colors */
  --tab-inactive-bg: rgba(255, 255, 255, 0.03);
  --tab-inactive-text: rgba(255, 255, 255, 0.4);
}

:root[data-theme="light"] {
  /* Bright ambient mesh background mix (Orange, Blue, Red tints) */
  --bg: radial-gradient(circle at 15% 15%, rgba(255, 92, 141, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(65, 105, 225, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 50% 75%, rgba(255, 165, 0, 0.25) 0%, transparent 40%),
        #f4f6fa;
  --surface: rgba(255, 255, 255, 0.85);
  --surface2: rgba(235, 239, 248, 0.9);
  --border: rgba(0, 0, 0, 0.12);
  --border-focus: #e65100;
  --accent: #e65100;
  --accent-gradient: linear-gradient(135deg, #ffb300, #ff6d00); /* Yellow-Orange Mix */
  --accent2: #05b58c;
  --text: #1a1d24;
  --text2: #4a5568;
  --text3: #8892a4;
  --success: #05b58c;
  --warning: #e6b400;
  --danger: #e53e3e;
  --glass-blur: blur(20px);
  --shadow: 0 12px 40px rgba(255, 109, 0, 0.1);

  /* Tab Colors */
  --tab-inactive-bg: rgba(0, 0, 0, 0.04);
  --tab-inactive-text: rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.2s ease, color 0.2s ease; }
body { font-family: 'Sora', sans-serif; background: var(--bg); background-attachment: fixed; color: var(--text); min-height: 100vh; padding-bottom: 100px; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; opacity: 0.5; }

/* PREMIUM CARD GLASSMORPHISM */
.card, .auth-box, .modal-sheet, .key-box {
  background: var(--surface);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: 20px;
}

/* BOOT SCREEN */
#boot-screen { position: fixed; inset: 0; background: #090b0f; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity 0.4s; }
#boot-screen.hidden { opacity: 0; pointer-events: none; }
.boot-logo { font-size: 48px; animation: bounce 1s ease infinite alternate; }
@keyframes bounce { from { transform: translateY(0) } to { transform: translateY(-10px) } }
.boot-text { font-size: 14px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
.boot-bar { width: 160px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; }
.boot-fill { height: 100%; background: var(--accent-gradient); border-radius: 999px; animation: load 2s ease forwards; }
@keyframes load { from { width: 0 } to { width: 100% } }

/* CUSTOM VISUAL AUTH SCREEN SETTINGS */
#auth-screen { position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center; padding: 20px; }
#auth-screen.show { display: flex; }
.auth-box { padding: 40px 32px; width: 100%; max-width: 420px; border: 1px solid rgba(255, 255, 255, 0.15); }
.auth-title { text-align: center; font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
.auth-sub { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 32px; }

/* Custom Login / Register Tab Layout */
.auth-tabs { display: flex; background: var(--tab-inactive-bg); border-radius: 14px; padding: 6px; margin-bottom: 28px; border: 1px solid var(--border); gap: 6px; }
.auth-tab { flex: 1; padding: 14px; text-align: center; font-size: 14px; font-weight: 700; border-radius: 10px; cursor: pointer; color: var(--tab-inactive-text); border: none; background: transparent; font-family: 'Sora', sans-serif; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

/* Login Active Tab & Action Button */
.auth-tab.login-tab.active, .btn-login-action {
  background: linear-gradient(135deg, #ff4e11, #ff9f00) !important;
  color: #ffffff !important;
  box-shadow: 0 6px 20px rgba(255, 78, 17, 0.4);
}
.btn-login-action:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 78, 17, 0.55); }

/* Register Active Tab & Action Button */
.auth-tab.register-tab.active, .btn-register-action {
  background: linear-gradient(135deg, #019974, #12e283) !important;
  color: #ffffff !important;
  box-shadow: 0 6px 20px rgba(1, 153, 116, 0.4);
}
.btn-register-action:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(1, 153, 116, 0.55); }

.auth-field { margin-bottom: 22px; position: relative; }
.auth-field label { font-size: 11px; font-weight: 700; color: var(--text2); display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
.auth-field input { width: 100%; padding: 14px 44px 14px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; color: var(--text); font-family: 'Sora', sans-serif; }
.auth-field input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 2px rgba(255, 188, 0, 0.2); }
.pass-toggle { position: absolute; right: 16px; bottom: 14px; cursor: pointer; color: var(--text2); user-select: none; font-size: 16px; }

/* Global App Saving Button */
.btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
.btn-save { background: var(--accent-gradient); color: #090b0f; font-weight: 800; box-shadow: 0 6px 25px rgba(255, 179, 0, 0.35); }
[data-theme="dark"] .btn-save { color: #090b0f; }
[data-theme="light"] .btn-save { color: #ffffff; }
.btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255, 140, 0, 0.5); }
.btn-save:active { transform: translateY(0); }
.btn-outline { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--text2); color: var(--text); }

/* APP LAYOUT & HEADERS */
.header { position: sticky; top: 0; z-index: 50; background: var(--surface); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-logo { width: 38px; height: 38px; background: var(--accent-gradient); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
.header-title { font-size: 16px; font-weight: 700; }
.header-date { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.header-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.header-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn { font-size: 16px; padding: 6px 10px; }

/* FLOATING INTERFACES & TABS */
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: 67px; z-index: 40; }
.tab { flex: 1; padding: 14px 8px; font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; border: none; background: none; color: var(--text3); border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.05em; min-width: 120px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.section { display: none; padding: 20px; max-width: 540px; margin: 0 auto; position: relative; z-index: 1; }
.section.active { display: block; }
.card { padding: 20px; margin-bottom: 16px; }
.card h3 { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
.accent-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* LISTS & TRACKERS */
.checklist-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.checklist-item:last-child { border-bottom: none; }
.checklist-item input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); }
.checklist-label { font-size: 14px; color: var(--text); font-weight: 500; }
.checklist-item.done .checklist-label { text-decoration: line-through; color: var(--text3); }
.time-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.time-row input[type=number] { width: 70px; padding: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; text-align: center; color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 600; }

textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--text); font-family: inherit; line-height: 1.6; min-height: 80px; margin-bottom: 12px; }
