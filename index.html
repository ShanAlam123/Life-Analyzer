<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Life Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* DARK THEME VARIABLES (DEFAULT) */
:root {
  --bg:#0d0f14;--surface:#151821;--surface2:#1c2030;--border:#252a3a;
  --accent:#6c63ff;--accent2:#00d9a6;--text:#e8eaf0;--text2:#8892a4;--text3:#4a5568;
  --success:#00d9a6;--warning:#f6c90e;--danger:#ff6b6b;
  --radius:14px;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
}

/* LIGHT THEME VARIABLES */
:root.light {
  --bg:#f4f6fa;--surface:#ffffff;--surface2:#f0f2f7;--border:#e2e8f0;
  --accent:#5346e0;--accent2:#00b88d;--text:#1a202c;--text2:#4a5568;--text3:#a0aec0;
  --success:#00b88d;--warning:#ddb005;--danger:#e53e3e;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px;overflow-x:hidden;transition: background 0.3s, color 0.3s;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(108,99,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(108,99,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

/* BOOT */
#boot-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.4s;}
#boot-screen.hidden{opacity:0;pointer-events:none;}
.boot-logo{font-size:48px;animation:bounce 1s ease infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.boot-text{font-size:14px;color:var(--text2);font-family:var(--mono);}
.boot-bar{width:160px;height:3px;background:var(--surface2);border-radius:999px;overflow:hidden;}
.boot-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;animation:load 2s ease forwards;}
@keyframes load{from{width:0}to{width:100%}}
.boot-error{color:var(--danger);font-size:12px;font-family:var(--mono);text-align:center;max-width:300px;line-height:1.8;display:none;white-space:pre-line;}

/* HEADER */
.header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;}
.header-brand{display:flex;align-items:center;gap:10px;}
.header-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.header-title{font-size:16px;font-weight:700;}
.header-date{font-size:11px;color:var(--text2);margin-top:1px;font-family:var(--mono);}
.header-actions{display:flex;align-items:center;gap:6px;}
.header-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:7px 12px;font-size:11px;font-family:var(--font);cursor:pointer;transition:all 0.2s;font-weight:600;display:flex;align-items:center;gap:4px;}
.header-btn:hover{border-color:var(--accent);color:var(--accent);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);display:inline-block;transition:background 0.3s;}
.sync-dot.synced{background:var(--success);box-shadow:0 0 6px var(--success);}
.sync-dot.syncing{background:var(--warning);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--danger);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* STATUS */
#status-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:7px 20px;font-size:11px;font-family:var(--mono);color:var(--text2);display:flex;align-items:center;gap:8px;}

/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:66px;z-index:40;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;padding:12px 8px;font-size:11px;font-weight:700;font-family:var(--font);text-align:center;cursor:pointer;border:none;background:none;color:var(--text3);white-space:nowrap;min-width:65px;border-bottom:2px solid transparent;transition:all 0.2s;letter-spacing:0.03em;text-transform:uppercase;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* FILTER BAR IN HISTORY */
.filter-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;font-weight:600;white-space:nowrap;transition:all 0.2s;}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* SECTIONS */
.section{display:none;padding:16px;max-width:520px;margin:0 auto;position:relative;z-index:1;}
.section.active{display:block;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card h3{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:0.08em;}
.accent-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* CHECKLIST */
.checklist-item{display:flex;align-items:center;gap
